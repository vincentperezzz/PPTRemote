<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PPT Remote">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="format-detection" content="telephone=no">
  <title>PPT Remote</title>
  <link rel="stylesheet" href="/styles.css?v=6">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-row">
        <div class="counter" id="counter">– / –</div>
        <span class="pill" id="pill" hidden>LIVE</span>
        <button class="icon-btn" id="moreBtn" type="button" aria-label="More controls">More</button>
        <button class="icon-btn" id="gridBtn" type="button" aria-label="Slide grid">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
      </div>
      <div class="title" id="title">Waiting for PowerPoint</div>
    </header>

    <div class="seg" role="tablist" aria-label="Presenter pane">
      <button type="button" role="tab" id="tabNotes" aria-selected="true">Notes</button>
      <button type="button" role="tab" id="tabNext" aria-selected="false">Next slide</button>
    </div>

    <main id="stage">
      <div class="notes" id="notes">Open a deck on the PC, then start the slideshow.</div>
      <div class="preview" id="preview" hidden>
        <img id="previewImg" alt="Next slide">
        <div class="preview-cap" id="previewCap"></div>
      </div>
    </main>

    <footer class="dock" id="dock">
      <button type="button" class="nav ghost" id="prevBtn" aria-label="Previous slide">Prev</button>
      <button type="button" class="nav solid" id="nextBtn" aria-label="Next slide">Next</button>
    </footer>
  </div>

  <div id="grid" class="sheet" hidden>
    <div class="sheet-top">
      <h2>Jump to slide</h2>
      <button type="button" class="icon-btn" id="gridClose" aria-label="Close grid">Done</button>
    </div>
    <div class="grid" id="gridList"></div>
  </div>

  <div id="more" class="sheet" hidden>
    <div class="sheet-top">
      <h2>Controls</h2>
      <button type="button" class="icon-btn" id="moreClose" aria-label="Close">Done</button>
    </div>
    <div class="actions">
      <button type="button" id="endBtn">End slideshow</button>
      <button type="button" id="blackBtn">Black screen</button>
      <button type="button" id="whiteBtn">White screen</button>
      <button type="button" id="firstBtn">First slide</button>
      <button type="button" id="lastBtn">Last slide</button>
    </div>
  </div>

  <div id="offline" class="overlay" hidden style="display:none !important">
    <p>Syncing with the PC…</p>
    <span id="offlineHint"></span>
    <button type="button" id="retryBtn">Retry</button>
  </div>

  <script>window.__BOOT = null;/*BOOT*/</script>
  <script src="/app.js?v=6"></script>
</body>
</html>
